services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: mwplanner
      POSTGRES_USER: mw
      POSTGRES_PASSWORD: mw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mw -d mwplanner"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      MW_DATABASE_URL: postgresql+psycopg://mw:mw@postgres:5432/mwplanner
      MW_PLANNER_CONFIG_PATH: /app/config/planner_config.yaml
      MW_DEM_DIRECTORY: /app/data/dem
      MW_CORS_ORIGINS: '["http://localhost:5173"]'
    volumes:
      - ./backend:/app/backend
      - ./config:/app/config:ro
      - ./data:/app/data
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    environment:
      VITE_API_BASE: http://localhost:8000
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
